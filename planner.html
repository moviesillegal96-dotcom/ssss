<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Planner</title>
<style>
:root{
  --bg:#f4f5fa; --card:#fff; --ink:#1c1e2b; --muted:#6b7086; --line:#e3e5ef;
  --accent:#4f46e5; --accent-ink:#fff; --accent-soft:#ebeafd; --warn:#c2410c; --warn-soft:#fff1e7;
  --ok:#15803d; --star:#d97706; --shadow:0 1px 3px rgba(20,22,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12131a; --card:#1c1e29; --ink:#eceef7; --muted:#9499b0; --line:#2c2f3f;
  --accent:#8b85ff; --accent-ink:#11121a; --accent-soft:#2a2a4a; --warn:#fb923c; --warn-soft:#3a2416;
  --ok:#4ade80; --star:#fbbf24; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 calc(40px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
h1{font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h1 small{font-size:13px;font-weight:500;color:var(--muted);margin-left:auto}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{flex:1;padding:8px 2px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin:12px 0}

/* add form */
#addText,.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
#addText{font-size:17px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;width:100%;margin:12px 0 -4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.when .field{width:auto;flex:1 1 130px;padding:8px 10px}
.when .whenlabel{font-size:13px;color:var(--muted);flex:1 1 100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--bg)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 20px;border-radius:10px}
.ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:14px}
#smart{font-size:13px;margin-top:8px;color:var(--accent);display:none}
#smart button{text-decoration:underline;color:var(--muted);margin-left:6px;font-size:13px}

/* nav */
.nav{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.nav h2{font-size:18px;margin:0;flex:1;text-align:center}
.nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px}
.nav .today{width:auto;padding:0 12px;font-size:14px;font-weight:600}

/* lists */
.sec{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  display:flex;align-items:center;gap:8px}
.sec.warn{color:var(--warn)}
.sec .n{font-weight:600;opacity:.7}
.sec button{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);text-transform:none;letter-spacing:0}
.sec.daylink{cursor:pointer}
.sec.isToday{color:var(--accent)}
ul.items{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{flex:none;width:40px;height:40px;display:grid;place-items:center}
.check i{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-style:normal;font-size:13px;color:transparent}
.done .check i{background:var(--ok);border-color:var(--ok);color:var(--card)}
.body{flex:1;min-width:0;padding:6px 0;cursor:pointer}
.txt{display:block;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted)}
.meta{display:block;font-size:12px;color:var(--muted)}
.meta b{color:var(--accent);font-weight:700}
.meta .late{color:var(--warn);font-weight:700}
.icon{flex:none;width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:16px;opacity:.55}
.icon:hover{opacity:1;background:var(--bg)}
.icon.star.on{color:var(--star);opacity:1}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--ok)}
.summary{font-size:13px;color:var(--muted);text-align:center}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal button.day{aspect-ratio:1/1;max-height:84px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--accent);color:var(--accent)}
.cal .day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:3px;height:7px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.d{background:var(--muted);opacity:.5}
.dots i.l{background:var(--warn)}
.sel .dots i{background:var(--accent-ink)}
.dots span{font-size:10px;line-height:1}

/* all view */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools .field{flex:1 1 180px;background:var(--card)}
.backup{display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,10,20,.5)}
dialog h3{margin:0 0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 14px;border-radius:12px;display:none;gap:12px;align-items:center;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
#toast button{color:inherit;font-weight:800;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗓️ Planner <small id="todayLabel"></small></h1>
    <nav class="tabs" id="tabs">
      <button data-view="day">Day</button>
      <button data-view="week">Week</button>
      <button data-view="month">Month</button>
      <button data-view="calendar">Calendar</button>
      <button data-view="all">All</button>
    </nav>
  </header>

  <form class="card" id="addForm" autocomplete="off">
    <input id="addText" placeholder="What do you need to do?" aria-label="What do you need to do?" enterkeyhint="done">
    <div id="smart"></div>
    <div class="lbl">For when?</div>
    <div class="row">
      <div class="chips" id="quick">
        <button type="button" class="chip" data-q="today">Today</button>
        <button type="button" class="chip" data-q="tomorrow">Tomorrow</button>
        <button type="button" class="chip" data-q="week">This week</button>
        <button type="button" class="chip" data-q="nextweek">Next week</button>
        <button type="button" class="chip" data-q="month">This month</button>
      </div>
    </div>
    <div class="row when" id="addWhen"></div>
    <div class="row" style="justify-content:flex-end"><button class="primary">Add</button></div>
  </form>

  <main id="view"></main>
</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3>Edit</h3>
    <input class="field" id="editText" aria-label="Text">
    <div class="row when" id="editWhen"></div>
    <div class="actions">
      <button type="button" class="ghost" id="editCancel">Cancel</button>
      <button class="primary" value="save">Save</button>
    </div>
  </form>
</dialog>
<div id="toast"><span></span><button type="button">Undo</button></div>

<script>
'use strict';
/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return ymd(d); };
const weekStart = s => { const d = parse(s); return addDays(s, -((d.getDay() + 6) % 7)); };   // Monday
const monthStart = s => s.slice(0, 7) + '-01';
const today = () => ymd(new Date());
const fmt = (s, o) => parse(s).toLocaleDateString('en-US', o);
const fmtDay = s => fmt(s, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtWeek = s => { const e = addDays(s, 6);
  return fmt(s, { month: 'short', day: 'numeric' }) + ' – ' + fmt(e, s.slice(0, 7) === e.slice(0, 7) ? { day: 'numeric' } : { month: 'short', day: 'numeric' }); };
const fmtMonth = s => fmt(s, { month: 'long', year: 'numeric' });
const fmtTime = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
const KEY = 'planner.v1';
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }
if (!Array.isArray(items)) items = [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };

/* item: {id, text, scope:'day'|'week'|'month', date, time, star, done, created}
   date = the day itself, the Monday of the week, or the 1st of the month */
const normDate = (scope, d) => scope === 'week' ? weekStart(d) : scope === 'month' ? monthStart(d) : d;
const endOf = it => it.scope === 'week' ? addDays(it.date, 6) : it.scope === 'month' ? addDays(addMonths(it.date, 1), -1) : it.date;
const isLate = it => !it.done && endOf(it) < today();
const whenLabel = it => it.scope === 'week' ? 'Week of ' + fmtWeek(it.date) : it.scope === 'month' ? fmtMonth(it.date) : fmtDay(it.date);

// automatic ordering: open first, timed by clock, then starred, then oldest first
const order = (a, b) => (a.done - b.done) || ((a.time ? 0 : 1) - (b.time ? 0 : 1)) || a.time.localeCompare(b.time)
  || (b.star - a.star) || (a.created - b.created);
const byDate = (a, b) => a.date.localeCompare(b.date) || order(a, b);
const dayItems = d => items.filter(i => i.scope === 'day' && i.date === d).sort(order);
const weekItems = d => items.filter(i => i.scope === 'week' && i.date === weekStart(d)).sort(order);
const monthItems = d => items.filter(i => i.scope === 'month' && i.date === monthStart(d)).sort(order);

/* ---------- state ---------- */
let view = 'day', cursor = today(), filter = 'open', query = '';
const addState = { scope: 'day', date: today(), time: '' };
let editState = null, editId = null, smartOff = false;
const $ = id => document.getElementById(id);

/* ---------- "for when" controls (shared by add form and edit dialog) ---------- */
function drawWhen(box, st) {
  const seg = ['day', 'week', 'month'].map(s => `<button type="button" data-scope="${s}" class="${st.scope === s ? 'on' : ''}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('');
  let ctl;
  if (st.scope === 'month') {
    const d = parse(st.date), y0 = Math.min(d.getFullYear(), new Date().getFullYear() - 1);
    ctl = `<select class="field" data-f="m" aria-label="Month">${MONTHS.map((m, i) => `<option value="${i}"${i === d.getMonth() ? ' selected' : ''}>${m}</option>`).join('')}</select>
      <select class="field" data-f="y" aria-label="Year">${Array.from({ length: 8 }, (_, i) => y0 + i).map(y => `<option${y === d.getFullYear() ? ' selected' : ''}>${y}</option>`).join('')}</select>`;
  } else {
    ctl = `<input class="field" type="date" data-f="date" value="${st.date}" aria-label="Date">`;
    if (st.scope === 'day') ctl += `<input class="field" type="time" data-f="time" value="${st.time}" aria-label="Time (optional)" title="Time (optional)">`;
  }
  const label = st.scope === 'day' ? fmt(st.date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + (st.time ? ' at ' + fmtTime(st.time) : ' · no time (to-do)')
    : st.scope === 'week' ? 'Any time in the week of ' + fmtWeek(weekStart(st.date)) : 'Any time in ' + fmtMonth(st.date);
  box.innerHTML = `<div class="seg">${seg}</div>${ctl}<div class="whenlabel">${label}</div>`;
}
function bindWhen(box, getSt) {
  box.addEventListener('click', e => { const b = e.target.closest('[data-scope]'); if (!b) return; getSt().scope = b.dataset.scope; drawWhen(box, getSt()); });
  box.addEventListener('change', e => {
    const f = e.target.dataset.f, st = getSt(); if (!f) return;
    if (f === 'date' && e.target.value) st.date = e.target.value;
    if (f === 'time') st.time = e.target.value;
    if (f === 'm' || f === 'y') st.date = box.querySelector('[data-f=y]').value + '-' + pad(+box.querySelector('[data-f=m]').value + 1) + '-01';
    drawWhen(box, st);
  });
}
bindWhen($('addWhen'), () => addState);
bindWhen($('editWhen'), () => editState);

/* ---------- smart text: "dentist tomorrow 3pm", "report next week" ---------- */
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function smart(text) {
  const out = {}; let t = text, m; const now = today();
  const cut = re => { const r = t.match(re); if (r) t = t.replace(re, ' '); return r; };
  if ((m = cut(/\b(?:at\s+)?(\d{1,2})(?::([0-5]\d))?\s*(am|pm)\b/i))) {
    let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; if (+m[1] >= 1 && +m[1] <= 12) out.time = pad(h) + ':' + (m[2] || '00');
  } else if ((m = cut(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/))) out.time = pad(+m[1]) + ':' + m[2];
  if ((m = cut(/\b(this|next)\s+(week|month)\b/i))) {
    const nx = /next/i.test(m[1]); out.scope = m[2].toLowerCase();
    out.date = out.scope === 'week' ? addDays(weekStart(now), nx ? 7 : 0) : addMonths(monthStart(now), nx ? 1 : 0);
  } else if ((m = cut(/\b(today|tonight|tomorrow)\b/i))) { out.scope = 'day'; out.date = /tomorrow/i.test(m[1]) ? addDays(now, 1) : now; }
  else if ((m = cut(new RegExp('\\b(?:on\\s+)?(next\\s+)?(' + DAYS.join('|') + ')\\b', 'i')))) {
    let diff = (DAYS.indexOf(m[2].toLowerCase()) - parse(now).getDay() + 7) % 7; if (m[1] && diff === 0) diff = 7;
    out.scope = 'day'; out.date = addDays(now, diff);
  }
  if (out.time && !out.scope) { out.scope = 'day'; out.date = addState.scope === 'day' ? addState.date : now; }
  if (out.scope !== 'day') delete out.time;
  if (!out.scope) return null;
  out.text = t.replace(/\s+/g, ' ').replace(/\s+(on|at|by)$/i, '').trim();
  return out.text ? out : null;
}
function drawSmart() {
  const s = smartOff ? null : smart($('addText').value), box = $('smart');
  box.style.display = s ? 'block' : 'none';
  if (s) box.innerHTML = '✨ Detected: <b>' + esc(whenLabel(s)) + (s.time ? ' at ' + fmtTime(s.time) : '') + '</b><button type="button" id="smartIgnore">ignore</button>';
  return s;
}
$('addText').addEventListener('input', drawSmart);
$('smart').addEventListener('click', e => { if (e.target.id === 'smartIgnore') { smartOff = true; drawSmart(); } });

/* ---------- add ---------- */
$('quick').addEventListener('click', e => {
  const q = e.target.dataset.q; if (!q) return; const n = today();
  Object.assign(addState, { today: { scope: 'day', date: n }, tomorrow: { scope: 'day', date: addDays(n, 1) }, week: { scope: 'week', date: n },
    nextweek: { scope: 'week', date: addDays(n, 7) }, month: { scope: 'month', date: n } }[q]);
  drawWhen($('addWhen'), addState); $('addText').focus();
});
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  let text = $('addText').value.trim(); if (!text) { $('addText').focus(); return; }
  const st = Object.assign({}, addState), s = smartOff ? null : smart(text);
  if (s) { text = s.text; st.scope = s.scope; st.date = s.date; if (s.time) st.time = s.time; }
  const it = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, scope: st.scope, date: normDate(st.scope, st.date),
    time: st.scope === 'day' ? st.time : '', star: false, done: false, created: Date.now() };
  items.push(it); save();
  $('addText').value = ''; addState.time = ''; smartOff = false; drawSmart(); drawWhen($('addWhen'), addState);
  if (view !== 'all') { cursor = it.date; if (view === 'calendar' && it.scope !== 'day') view = it.scope; else if (view === 'day' && it.scope !== 'day') view = it.scope; }
  render(); toast('Added to ' + whenLabel(it) + (it.time ? ' at ' + fmtTime(it.time) : ''));
  $('addText').focus();
});

/* ---------- rendering ---------- */
function row(it, showWhen) {
  const bits = [];
  if (it.time) bits.push('<b>' + fmtTime(it.time) + '</b>');
  if (showWhen) bits.push(esc(whenLabel(it)));
  if (isLate(it)) bits.push('<span class="late">overdue</span>');
  return `<li class="item${it.done ? ' done' : ''}" data-id="${it.id}">
    <button class="check" data-act="toggle" aria-label="${it.done ? 'Mark not done' : 'Mark done'}"><i>✓</i></button>
    <div class="body" data-act="edit"><span class="txt">${esc(it.text)}</span>${bits.length ? '<span class="meta">' + bits.join(' · ') + '</span>' : ''}</div>
    <button class="icon star${it.star ? ' on' : ''}" data-act="star" aria-label="Important">${it.star ? '★' : '☆'}</button>
    <button class="icon" data-act="del" aria-label="Delete">✕</button></li>`;
}
const list = (arr, showWhen) => '<ul class="items">' + arr.map(i => row(i, showWhen)).join('') + '</ul>';
const sec = (title, arr, opt = {}) => !arr.length ? '' :
  `<div class="sec ${opt.cls || ''}"${opt.day ? ` data-day="${opt.day}"` : ''}>${title} <span class="n">${arr.filter(i => !i.done).length || '✓'}</span>${opt.btn || ''}</div>` + list(arr, opt.showWhen);
const empty = msg => `<div class="empty">${msg}</div>`;
function summary(arr) {
  if (!arr.length) return '';
  const d = arr.filter(i => i.done).length;
  return `<div class="progress"><i style="width:${Math.round(d / arr.length * 100)}%"></i></div><div class="summary">${d} of ${arr.length} done</div>`;
}
const nav = title => `<div class="nav"><button data-nav="-1" aria-label="Previous">‹</button><h2>${title}</h2>
  <button class="today" data-nav="0">Today</button><button data-nav="1" aria-label="Next">›</button></div>`;
const overdue = () => items.filter(isLate).sort(byDate);

function dayBlocks(d) {
  const its = dayItems(d);
  return sec('Schedule', its.filter(i => i.time)) + sec('To-do', its.filter(i => !i.time));
}
function renderDay() {
  const its = dayItems(cursor), isT = cursor === today(), late = isT ? overdue() : [];
  const wk = weekItems(cursor), mo = monthItems(cursor);
  const title = (isT ? 'Today · ' : cursor === addDays(today(), 1) ? 'Tomorrow · ' : '') + fmtDay(cursor);
  return nav(title) + summary(its)
    + sec('Overdue', late, { cls: 'warn', showWhen: true, btn: '<button data-act="rollover">Move all to today</button>' })
    + dayBlocks(cursor)
    + (its.length || late.length ? '' : empty(isT ? 'Nothing planned for today. Add something above.' : 'Nothing planned for this day.'))
    + sec('Any time this week', wk) + sec('Any time this month', mo);
}
function renderWeek() {
  const ws = weekStart(cursor), days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const all = items.filter(i => (i.scope === 'day' && i.date >= ws && i.date <= days[6]) || (i.scope === 'week' && i.date === ws));
  let h = nav('Week of ' + fmtWeek(ws)) + summary(all) + sec('Any time this week', weekItems(ws));
  for (const d of days) h += sec(fmt(d, { weekday: 'long', month: 'short', day: 'numeric' }) + (d === today() ? ' · today' : ''), dayItems(d),
    { day: d, cls: 'daylink' + (d === today() ? ' isToday' : '') });
  return h + (all.length ? '' : empty('Nothing planned for this week.'));
}
function renderMonth() {
  const ms = monthStart(cursor), me = addDays(addMonths(ms, 1), -1);
  const days = items.filter(i => i.scope === 'day' && i.date >= ms && i.date <= me);
  const weeks = items.filter(i => i.scope === 'week' && i.date <= me && addDays(i.date, 6) >= ms);
  const all = days.concat(weeks, monthItems(ms));
  let h = nav(fmtMonth(ms)) + summary(all) + sec('Any time this month', monthItems(ms));
  for (let w = weekStart(ms); w <= me; w = addDays(w, 7)) {
    const we = addDays(w, 6), inW = days.filter(i => i.date >= w && i.date <= we).sort(byDate).concat(weeks.filter(i => i.date === w).sort(order));
    h += sec('Week of ' + fmtWeek(w), inW, { showWhen: true });
  }
  return h + (all.length ? '' : empty('Nothing planned for this month.'));
}
function renderCalendar() {
  const ms = monthStart(cursor), m = ms.slice(0, 7), t = today();
  let h = nav(fmtMonth(ms)) + '<div class="cal">' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('');
  const last = weekStart(addDays(addMonths(ms, 1), -1));
  for (let d = weekStart(ms); d <= addDays(last, 6); d = addDays(d, 1)) {
    const its = dayItems(d), dots = its.slice(0, 3).map(i => `<i class="${i.done ? 'd' : isLate(i) ? 'l' : ''}"></i>`).join('');
    h += `<button class="day${d.slice(0, 7) !== m ? ' out' : ''}${d === t ? ' today' : ''}${d === cursor ? ' sel' : ''}" data-day="${d}"
      aria-label="${fmtDay(d)}, ${its.length} item${its.length === 1 ? '' : 's'}">${parse(d).getDate()}<span class="dots">${dots}${its.length > 3 ? '<span>+' + (its.length - 3) + '</span>' : ''}</span></button>`;
  }
  h += '</div>';
  const its = dayItems(cursor);
  h += `<div class="sec">${fmt(cursor, { weekday: 'long', month: 'long', day: 'numeric' })}</div>` + (its.length ? list(its) : empty('Nothing on this day. Type above to add something for it.'));
  return h + sec('Any time this week', weekItems(cursor)) + sec('Any time this month', monthItems(cursor));
}
function renderAll() {
  const q = query.toLowerCase(), t = today();
  const pool = items.filter(i => (filter === 'all' || (filter === 'done') === i.done) && (!q || i.text.toLowerCase().includes(q)));
  const open = pool.filter(i => !i.done), late = open.filter(isLate).sort(byDate);
  const rest = open.filter(i => !isLate(i));
  let h = `<div class="tools"><input class="field" id="search" type="search" placeholder="Search everything…" aria-label="Search" value="${esc(query)}">
    <div class="seg" id="filter">${['open', 'done', 'all'].map(f => `<button data-filter="${f}" class="${filter === f ? 'on' : ''}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}</div></div>`;
  h += sec('Overdue', late, { cls: 'warn', showWhen: true, btn: '<button data-act="rollover">Move all to today</button>' })
    + sec('Today', rest.filter(i => i.scope === 'day' && i.date === t).sort(order))
    + sec('Upcoming days', rest.filter(i => i.scope === 'day' && i.date > t).sort(byDate), { showWhen: true })
    + sec('Weekly', rest.filter(i => i.scope === 'week').sort(byDate), { showWhen: true })
    + sec('Monthly', rest.filter(i => i.scope === 'month').sort(byDate), { showWhen: true })
    + sec('Done', pool.filter(i => i.done).sort((a, b) => byDate(b, a)), { showWhen: true,
        btn: '<button data-act="cleardone">Clear done</button>' });
  if (!pool.length) h += empty(items.length ? 'Nothing matches.' : 'Your list is empty. Add your first item above.');
  return h + `<div class="backup"><button class="ghost" data-act="export">Export backup</button><button class="ghost" data-act="import">Import backup</button></div>`;
}
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('todayLabel').textContent = fmt(today(), { weekday: 'long', month: 'long', day: 'numeric' });
  const focus = document.activeElement && document.activeElement.id === 'search', pos = focus ? document.activeElement.selectionStart : 0;
  $('view').innerHTML = { day: renderDay, week: renderWeek, month: renderMonth, calendar: renderCalendar, all: renderAll }[view]();
  if (focus) { const s = $('search'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (e) {} }
}
// keep the "for when" picker following what you are looking at
function syncAdd() {
  if (view === 'all') return;
  addState.scope = view === 'week' ? 'week' : view === 'month' ? 'month' : 'day'; addState.date = cursor;
  drawWhen($('addWhen'), addState);
}

/* ---------- events ---------- */
$('tabs').addEventListener('click', e => { const v = e.target.dataset.view; if (!v) return; view = v; syncAdd(); render(); });
let toastTimer;
function toast(msg, undo) {
  const t = $('toast'); t.firstElementChild.textContent = msg; t.lastElementChild.style.display = undo ? '' : 'none';
  t.lastElementChild.onclick = () => { undo(); t.style.display = 'none'; };
  t.style.display = 'flex'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', undo ? 6000 : 2500);
}
function restore(snapshot, msg) { toast(msg, () => { items = snapshot; save(); render(); }); }

$('view').addEventListener('click', e => {
  const n = e.target.closest('[data-nav]');
  if (n) {
    const s = +n.dataset.nav;
    cursor = !s ? today() : view === 'day' ? addDays(cursor, s) : view === 'week' ? addDays(cursor, 7 * s) : addMonths(cursor, s);
    syncAdd(); return render();
  }
  const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; return render(); }
  const a = e.target.closest('[data-act]'), li = e.target.closest('.item'), it = li && items.find(i => i.id === li.dataset.id);
  if (a) {
    const act = a.dataset.act, snap = items.map(i => Object.assign({}, i));
    if (act === 'toggle' && it) it.done = !it.done;
    else if (act === 'star' && it) it.star = !it.star;
    else if (act === 'del' && it) { items = items.filter(i => i !== it); restore(snap, 'Deleted'); }
    else if (act === 'edit' && it) return openEdit(it);
    else if (act === 'rollover') { let c = 0; items.forEach(i => { if (isLate(i)) { i.date = normDate(i.scope, today()); c++; } }); restore(snap, 'Moved ' + c + ' to today'); }
    else if (act === 'cleardone') { const c = items.filter(i => i.done).length; items = items.filter(i => !i.done); restore(snap, 'Cleared ' + c + ' done'); }
    else if (act === 'export') return exportData();
    else if (act === 'import') return importData();
    save(); return render();
  }
  const d = e.target.closest('[data-day]');
  if (d) { cursor = d.dataset.day; if (view !== 'calendar') view = 'day'; syncAdd(); render(); }
});
$('view').addEventListener('input', e => { if (e.target.id === 'search') { query = e.target.value; render(); } });

function openEdit(it) {
  editId = it.id; editState = { scope: it.scope, date: it.date, time: it.time };
  $('editText').value = it.text; drawWhen($('editWhen'), editState); $('editDlg').showModal();
}
$('editCancel').addEventListener('click', () => $('editDlg').close());
$('editForm').addEventListener('submit', () => {
  const it = items.find(i => i.id === editId), text = $('editText').value.trim(); if (!it || !text) return;
  Object.assign(it, { text, scope: editState.scope, date: normDate(editState.scope, editState.date), time: editState.scope === 'day' ? editState.time : '' });
  save(); render();
});

function exportData() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 1)], { type: 'application/json' }));
  a.download = 'planner-backup-' + today() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(txt => {
    let arr; try { arr = JSON.parse(txt); } catch (e) { return toast('That file is not a planner backup'); }
    if (!Array.isArray(arr)) return toast('That file is not a planner backup');
    const have = new Set(items.map(i => i.id)), snap = items.slice();
    const good = arr.filter(i => i && typeof i.text === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(i.date) && ['day', 'week', 'month'].includes(i.scope) && !have.has(String(i.id)))
      .map(i => ({ id: String(i.id), text: i.text, scope: i.scope, date: normDate(i.scope, i.date), time: /^\d{2}:\d{2}$/.test(i.time) ? i.time : '',
        star: !!i.star, done: !!i.done, created: +i.created || Date.now() }));
    items = items.concat(good); save(); render(); restore(snap, 'Imported ' + good.length + ' item' + (good.length === 1 ? '' : 's'));
  }); };
  inp.click();
}

// refresh when the date changes while the app is open
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

drawWhen($('addWhen'), addState);
render();
</script>
</body>
</html>
